name: iOS build

# This file is the single source of truth for every build in the runner, and it
# is mirrored byte-for-byte into the tbuild-actions service as its embedded
# template (/opt/tbuild-actions/build-workflow.yml). The service rewrites
# .github/workflows/build.yml on every app-branch job, so editing a build
# branch by hand is pointless: change it here and in the template together.
#
# The service rebuilds every app branch from tbuild-ios-base, overriding only
# .github/workflows/build.yml and build-system/branding/{branding.json,
# logo.png,server_rsa.pub}. Everything else a build branch contains comes from
# the base tree, which is the default branch pinned by TBUILD_SOURCE_SHA.
#
# Every job below builds the same tree in the same absolute location and pins
# the same toolchain, so the bazel action keys are comparable across branches
# and one cache seeded from the default branch can serve all of them.
on:
  push:
    # App branches are bare slugs, so the trigger cannot be a positive pattern
    # and the exclusion list has to name the two non-build branches: the
    # default branch and the runner's immutable build base. The service's own
    # workflow_test.go asserts exactly these two entries.
    branches-ignore:
      - "master"
      - "tbuild-ios-base"

  # Manual trigger. The default branch no longer builds on push, so this is how
  # anything is started there. The dispatch inputs below are the only dispatch
  # inputs in this workflow; a build branch gets a push and nothing else, which
  # is why the template copy of this file has no workflow_dispatch at all.
  workflow_dispatch:
    inputs:
      # Three modes, on the default branch:
      #
      #   probe_only   restore both golden entries, report whether they arrived,
      #                empty the paths, exit. About two minutes, no compilation.
      #                This is the cheap end-to-end check of the cache wiring.
      #   seed_cache   compile the unbranded tree and save a new golden
      #                generation. A full compile, and deliberately cold.
      #   neither      an ordinary branded build of this branch, with a release.
      #
      # seed_cache wins if both are set, since a seed is a build too.
      seed_cache:
        description: "Rebuild the shared golden cache from the unbranded tree (a full cold compile)"
        type: boolean
        default: false
      probe_only:
        description: "Only restore the golden caches and report, without building"
        type: boolean
        default: false

  # GitHub deletes cache entries that have not been accessed in 7 days. This
  # restores the golden entries once a week to keep them alive during quiet
  # periods. It builds nothing, but restoring does download the entries.
  schedule:
    - cron: "17 4 * * 1"

# The source/build jobs are read-only. Only the isolated publish job receives
# contents:write, and it never checks out or executes source-controlled code.
permissions:
  contents: read

# One run at a time across the whole runner. The tbuild-actions service already
# serialises its queue and refuses to start a later job before the previous run
# is terminal; this is the second line of defence, and it also keeps a cache
# rotation from overlapping a build that is reading the same cache.
concurrency:
  group: tbuild-actions-${{ github.repository }}
  cancel-in-progress: false

env:
  SOURCE_DIR: /Users/Shared/telegram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
  # Both cache directories live outside SOURCE_DIR so bazel never treats them
  # as part of the source tree. Their absolute paths are part of the contract:
  # the save and the restore must agree on them.
  BAZEL_CACHE_DIR: /private/var/tmp/tbuild-cache/bazel-disk
  REPO_CACHE_DIR: /private/var/tmp/tbuild-cache/repos
  # Guard rails for the seed, not the quota. These upper bounds only reject
  # something implausible for a single build. The quota is enforced after the
  # save, against stored bytes, by the Verify step in the golden job - the one
  # number that matters is the compressed size, which `du` cannot see.
  MIN_CAS_KB: "262144"    # 256 MiB - below this the build never got going
  MAX_CAS_KB: "9437184"   # 9 GiB
  MAX_REPOS_KB: "3670016" # 3.5 GiB
  # GitHub's default Actions cache quota, adjustable in repository settings if a
  # future upstream bump needs more room. That is far cheaper than self-hosting.
  QUOTA_BYTES: "10737418240"
  QUOTA_GIB: "10"

jobs:
  # ---------------------------------------------------------------------------
  # Branded build. Restores the golden caches and never writes them: it only
  # ever uses actions/cache/restore with lookup-only, so no post-job save can
  # fire, and it contains no save step at all. The only job that creates a cache
  # entry is golden, below.
  # ---------------------------------------------------------------------------
  build:
    # A probe-only dispatch is the cache wiring check and must not drag a
    # full compile behind it; seed_cache deliberately does build.
    if: github.event_name != 'schedule' && !inputs.probe_only
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      app_name: ${{ steps.metadata.outputs.app_name }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      ipa_name: ${{ steps.metadata.outputs.ipa_name }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Checkout app branch without persisted credentials
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: "0"
          persist-credentials: false

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      # Cache handling is strictly best-effort and must never be able to fail a
      # build. A missing entry, a truncated download, an entry evicted by the
      # 7-day policy, a generation left by an older layout and a half-written
      # directory all end the same way: the build compiles the whole tree exactly
      # as it did before any of this existed.
      #
      # This step MUST NOT set lookup-only. Despite the name, lookup-only makes
      # actions/cache find the entry, report cache-hit: 'true', and then skip the
      # download: the log says "Lookup only - skipping download". A build wired
      # that way silently compiles from scratch while every step reports success,
      # which is exactly what happened once already, and cost a 65-minute build
      # that reported cache-hit: 'true' the whole way.
      #
      # actions/cache/restore arms a post-job save when it misses, and there is
      # no setting that downloads without arming one. So a build must be stopped
      # from writing some other way, and that is what the "Release restored
      # cache" step below does: it empties both paths before the job's post-job
      # steps run, so there is nothing to upload. An entry is write-once, so a
      # branded or partial cache saved by a builder would permanently shadow the
      # real golden for every future build.
      #
      # cache-mode: read was tried here as a second, platform-level guard and
      # removed: the first build with it failed the publish job with
      # "HTTP 403: Resource not accessible by integration" on the releases API,
      # while the publish job's own permissions were unchanged. Do not reintroduce
      # it without a full build plus publish to prove it is inert.
      #
      # The key is derived from files that are byte-identical on every branch, so
      # all builders share one entry and an upstream bump rotates it at once.
      - name: Restore golden bazel disk cache
        id: restore_cas
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: ios-golden-cas-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-golden-cas-v1-${{ runner.os }}-

      - name: Restore golden external repository cache
        id: restore_repos
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.REPO_CACHE_DIR }}
          key: ios-golden-repos-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-golden-repos-v1-${{ runner.os }}-

      # Report what the restore actually produced. This deliberately does not
      # delete anything: a wrong guess about the cache layout must cost a slow
      # build, never a silently discarded download. The two failure shapes worth
      # shouting about are a hit that produced no usable directory, and content
      # in an unexpected shape - both are bugs here, not conditions to absorb.
      - name: Report restored cache content
        id: scrub
        continue-on-error: true
        run: |
          set -euo pipefail
          cas_hit="${{ steps.restore_cas.outputs.cache-hit }}"
          repos_hit="${{ steps.restore_repos.outputs.cache-hit }}"
          echo "disk cache hit:  '$cas_hit'"
          echo "repos cache hit: '$repos_hit'"

          # $1 dir, $2 expected subdir, $3 label, $4 whether a hit was reported
          inspect() {
            dir="$1"; marker="$2"; label="$3"; hit="$4"
            if [ ! -d "$dir" ]; then
              if [ "$hit" = "true" ]; then
                echo "::error::$label reported a cache hit but $dir does not exist - the entry was matched and never downloaded, so this build is compiling from scratch"
              else
                echo "$label: absent, no entry to restore; compiling from scratch"
              fi
              return 0
            fi
            size_kb=$(du -sk "$dir" 2>/dev/null | cut -f1)
            echo "$label: $((size_kb / 1024)) MiB, top level: $(find "$dir" -mindepth 1 -maxdepth 1 2>/dev/null | sed 's|.*/||' | tr '\n' ' ')"
            if [ ! -d "$dir/$marker" ]; then
              echo "::error::$label at $dir has no $marker/ directory. Leaving it in place rather than deleting a possibly-valid download; if bazel misses, the layout assumption in this step is wrong and needs fixing."
            fi
          }

          inspect "$BAZEL_CACHE_DIR" cas "bazel disk cache" "$cas_hit"
          inspect "$REPO_CACHE_DIR" content_addressable "external repository cache" "$repos_hit"

      - name: Prepare canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf "$SOURCE_DIR"
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" "$SOURCE_DIR"
          # The checkout has no persisted write credential. Keep .git only for
          # the build number/revision commands; never expose a token to source.

      - name: Apply branding and datacenter
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python3 build-system/apply_branding.py build-system/branding/branding.json

      - name: Regenerate provisioning profiles
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          rm -rf build-system/fake-codesigning/profiles-backup
          cp -R build-system/fake-codesigning/profiles build-system/fake-codesigning/profiles-backup
          python3 build-system/Make/RegenerateProfilesForBundleId.py \
            --configurationPath=build-system/appstore-configuration.json \
            --sourceProfiles=build-system/fake-codesigning/profiles-backup \
            --destinationProfiles=build-system/fake-codesigning/profiles \
            --certsPath=build-system/fake-codesigning/certs

      - name: Generate app icons
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade --break-system-packages Pillow==11.3.0
          cd "$SOURCE_DIR"
          python3 build-system/generate_icons.py

      - name: Build and verify IPA
        id: metadata
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          export APP_VERSION
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER_OFFSET=$(cat build_number_offset)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          APP_NAME=$(python3 -c 'import json; print(json.load(open("build-system/branding/branding.json"))["general"]["app_name"])')
          printf 'APP_VERSION=%s\nBUILD_NUMBER=%s\n' "$APP_VERSION" "$BUILD_NUMBER" >> "$GITHUB_ENV"

          # Ship the IPA under the brand name from branding.json rather than the
          # upstream Telegram.ipa. app_name is free-form, so reduce it to a safe
          # filename and hand the result to the upload and publish steps instead
          # of letting either re-derive it.
          IPA_NAME=$(printf '%s' "$APP_NAME" | tr -c 'A-Za-z0-9._-' '_')
          IPA_NAME="${IPA_NAME%.ipa}"
          [ -n "$IPA_NAME" ] || IPA_NAME="App"
          ARTIFACT_NAME="ios-ipa-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}"
          printf 'app_name=%s\napp_version=%s\nbuild_number=%s\nipa_name=%s.ipa\nartifact_name=%s\n' \
            "$APP_NAME" "$APP_VERSION" "$BUILD_NUMBER" "$IPA_NAME" "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          # --cacheDir maps to bazel's --disk_cache. Make.py's --bazelArguments
          # is parsed but never reaches the bazel command line, so the repository
          # cache goes through the user rc file, which bazel reads after the
          # workspace one and which nothing in the source tree sets.
          mkdir -p "$REPO_CACHE_DIR"
          printf 'common --repository_cache=%s\n' "$REPO_CACHE_DIR" > "$HOME/.bazelrc"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH=build/artifacts
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_FOUND=0
          for candidate in \
            bazel-bin/Telegram/Telegram.ipa \
            bazel-out/applebin_ios-ios_arm64-opt-ST-*/bin/Telegram/Telegram.ipa \
            bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "$OUTPUT_PATH/$IPA_NAME.ipa"
              IPA_FOUND=1
              break
            fi
          done

          if [ "$IPA_FOUND" -ne 1 ]; then
            echo "ERROR: the build completed but no Telegram.ipa was found" >&2
            find bazel-bin bazel-out -name '*.ipa' -type f -print 2>/dev/null || true
            exit 1
          fi
          test "$(wc -c < "$OUTPUT_PATH/$IPA_NAME.ipa")" -gt 1048576
          unzip -tq "$OUTPUT_PATH/$IPA_NAME.ipa"
          ls -lh "$OUTPUT_PATH/$IPA_NAME.ipa"

          # upload-artifact resolves `path` against $GITHUB_WORKSPACE, not
          # $SOURCE_DIR, so stage the verified IPA there. This is also what makes
          # if-no-files-found: error a meaningful check.
          mkdir -p "$GITHUB_WORKSPACE/build/artifacts"
          cp "$OUTPUT_PATH/$IPA_NAME.ipa" "$GITHUB_WORKSPACE/build/artifacts/$IPA_NAME.ipa"

      - name: Upload IPA to the workflow artifact store
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: build/artifacts/${{ steps.metadata.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 1

      # The IPA is built and the cache has served its purpose, so empty both
      # cache paths before the job's post-job steps run. This is the ONLY thing
      # stopping a builder from writing the golden, and it is verified: after a
      # build restored 1.5 GiB and released 7.0 GiB, the repository still held
      # exactly the two seeded entries. The runner is discarded either way, so
      # releasing the cache costs nothing.
      - name: Release restored cache
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          for dir in "$BAZEL_CACHE_DIR" "$REPO_CACHE_DIR"; do
            if [ -d "$dir" ]; then
              du -sh "$dir" 2>/dev/null | sed 's/^/  releasing /'
              rm -rf "${dir:?}"
            fi
          done
          echo "cache paths emptied; nothing left for a post-job save to upload"

  # ---------------------------------------------------------------------------
  # Golden cache seed. Runs only on the default branch, only on demand, and
  # only when the dispatch asked for it, so an ordinary manual build does not
  # pay for a second full compile alongside it.
  #
  # It builds the tree with no branding applied at all, so the cache holds the
  # longest prefix shared by every future brand: ffmpeg, third-party, sqlcipher
  # and the untouched submodules all become reusable, and only the handful of
  # modules a brand actually edits get recompiled per build.
  #
  # It never uploads a release. A build failure here is tolerated on purpose -
  # a signing or packaging failure still leaves a perfectly good compile cache
  # behind, and refusing to save it would throw away 45 minutes of work.
  # ---------------------------------------------------------------------------
  golden:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.seed_cache
    runs-on: macos-latest
    timeout-minutes: 240
    permissions:
      contents: read
      # Only this job creates or removes cache entries, so it is the only one
      # that needs an actions token with write access.
      actions: write
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: "0"
          persist-credentials: false

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      # A seed is deliberately always a cold build. Restoring the previous
      # generation here would need a download, and there is no lookup-only
      # setting that downloads without arming a post-job save - and a post-job
      # save would bypass the MIN_CAS_KB guard below, so a seed that died during
      # analysis could install a near-empty entry under the new key and shadow
      # the good generation for every future build. A rotation therefore costs
      # one full compile, which is the price of never shipping a bad golden.
      #
      # The explicit save steps further down are the only thing in this workflow
      # that writes a cache entry.
      - name: Prepare canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf "$SOURCE_DIR"
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" "$SOURCE_DIR"

      - name: Configure repository cache
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$REPO_CACHE_DIR"
          printf 'common --repository_cache=%s\n' "$REPO_CACHE_DIR" > "$HOME/.bazelrc"

      - name: Compile unbranded tree
        id: compile
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          # Fixed build number: the number reaches variables.bzl and therefore
          # the //Telegram packaging actions, and a stable value keeps them
          # comparable between generations.
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=1

      - name: Measure generated caches
        id: size
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          cas_kb=0
          repos_kb=0
          [ -d "$BAZEL_CACHE_DIR" ] && cas_kb=$(du -sk "$BAZEL_CACHE_DIR" | cut -f1)
          [ -d "$REPO_CACHE_DIR" ] && repos_kb=$(du -sk "$REPO_CACHE_DIR" | cut -f1)

          # Report MiB with a decimal, and the exact KiB, because integer GiB
          # rounds 5.0 and 5.9 to the same "5" and that is exactly how a
          # threshold got mis-calibrated against this number once already.
          mib() { awk -v k="$1" 'BEGIN{printf "%.0f", k/1024}'; }
          echo "compile step exit: ${{ steps.compile.outcome }}"
          echo "bazel disk cache:  $(mib "$cas_kb") MiB ($cas_kb KiB on disk, uncompressed)"
          echo "repository cache:  $(mib "$repos_kb") MiB ($repos_kb KiB on disk, uncompressed)"

          # Two-sided guard, but the upper bound is only a pathology guard, not
          # the quota. actions/cache zstd-compresses before uploading, so the
          # quota applies to the STORED size, which is unknowable until after
          # the save. Enforcing the quota against `du` compares the wrong units
          # and silently threw away a perfectly good 5.4 GiB cache once already.
          # The real quota check is the Verify step after the saves; this bound
          # only rejects something implausible for a single build.
          if [ "$cas_kb" -ge "$MIN_CAS_KB" ] && [ "$cas_kb" -le "$MAX_CAS_KB" ]; then
            echo "save_cas=true" >> "$GITHUB_OUTPUT"
          else
            echo "save_cas=false" >> "$GITHUB_OUTPUT"
            # ::error:: not ::warning::. A skipped disk-cache save silently
            # disables every speedup this design exists for, while the build
            # still succeeds and still looks healthy.
            echo "::error::bazel disk cache is $(mib "$cas_kb") MiB, outside [$(mib "$MIN_CAS_KB"), $(mib "$MAX_CAS_KB")] MiB - NOT saving, so the next build will compile from scratch. Raise MAX_CAS_KB if this is a real build."
          fi

          if [ "$repos_kb" -gt 0 ] && [ "$repos_kb" -le "$MAX_REPOS_KB" ]; then
            echo "save_repos=true" >> "$GITHUB_OUTPUT"
          else
            echo "save_repos=false" >> "$GITHUB_OUTPUT"
            echo "::warning::repository cache is $(mib "$repos_kb") MiB, outside (0, $(mib "$MAX_REPOS_KB")] MiB - not saving"
          fi

      - name: Save golden bazel disk cache
        if: steps.size.outputs.save_cas == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: ios-golden-cas-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}

      - name: Save golden external repository cache
        if: steps.size.outputs.save_repos == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.REPO_CACHE_DIR }}
          key: ios-golden-repos-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}

      # Report what the entries actually cost, and hold the repository to its
      # quota in the only unit that matters. actions/cache compresses before
      # uploading, so the quota is measured against STORED bytes and the only
      # honest way to enforce it is to read the stored sizes back after saving.
      # This is also the first run that produces the real compression ratio
      # between the on-disk CAS and the uploaded entry, which is the number the
      # thresholds should have been derived from.
      - name: Verify stored cache size against the quota
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CAS_PREFIX: ios-golden-cas-v1-
        run: |
          set -uo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > /tmp/caches.json

          python3 - <<'PY' > /tmp/quota.txt
          import json, os
          quota = int(os.environ["QUOTA_BYTES"])
          prefix = os.environ["CAS_PREFIX"]
          caches = json.load(open("/tmp/caches.json")).get("actions_caches", [])
          total = 0
          worst = None
          for c in sorted(caches, key=lambda c: -c["size_in_bytes"]):
              size = c["size_in_bytes"]
              total += size
              print("  %6.2f GiB  %s" % (size / 2**30, c["key"]))
              if c["key"].startswith(prefix) and (worst is None or size > worst[1]):
                  worst = (c["id"], size)
          print("TOTAL %d" % total)
          if worst:
              print("CASID %d" % worst[0])
          print("OVER %d" % (1 if total > quota else 0))
          PY

          grep -E '^TOTAL |^CASID |^OVER ' /tmp/quota.txt || true
          total=$(awk '/^TOTAL /{print $2}' /tmp/quota.txt)
          over=$(awk '/^OVER /{print $2}' /tmp/quota.txt)
          gib() { awk -v b="$1" 'BEGIN{printf "%.2f", b/1073741824}'; }

          echo "stored cache total: $(gib "${total:-0}") GiB of quota $QUOTA_GIB GiB"
          if [ "${over:-0}" = "1" ]; then
            id=$(awk '/^CASID /{print $2}' /tmp/quota.txt)
            echo "::error::over quota; deleting this generation's disk cache entry $id so the repository keeps the previous generation instead"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" || true
          elif [ "${{ steps.size.outputs.save_cas }}" != "true" ]; then
            echo "::error::the disk cache was NOT saved this run, so every build will keep compiling from scratch until a seed succeeds"
          else
            echo "::notice::golden cache stored within quota; builders will hit it"
          fi

      # Best effort. A cache entry is write-once, so the superseded generation
      # has to be deleted explicitly or it lingers until eviction and pushes the
      # repository over quota alongside its replacement. Failure here only costs
      # quota, so it must not fail the job. This is the one job that gets
      # actions:write, and it is the one job allowed to manage cache entries.
      - name: Retire superseded golden entries
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CAS: ios-golden-cas-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          CURRENT_REPOS: ios-golden-repos-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
        run: |
          set -uo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > /tmp/caches.json
          python3 -c '
          import json, os
          keep = {os.environ["CURRENT_CAS"], os.environ["CURRENT_REPOS"]}
          caches = json.load(open("/tmp/caches.json")).get("actions_caches", [])
          for c in caches:
              if c["key"].startswith("ios-golden-") and c["key"] not in keep:
                  print(c["id"])
          ' > /tmp/stale_ids
          while read -r id; do
            [ -n "$id" ] || continue
            echo "deleting superseded cache $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" || true
          done < /tmp/stale_ids

  # ---------------------------------------------------------------------------
  # Weekly keepalive. Restores the golden entries so their last-access clock is
  # refreshed and the 7-day eviction window does not swallow them. This builds
  # nothing, but a restore is a real download, so it costs a few minutes of
  # runner time rather than a minute.
  # ---------------------------------------------------------------------------
  keepalive:
    # Also dispatchable, which makes it the cheap end-to-end probe for cache
    # wiring: it restores both entries, prints whether they arrived, empties the
    # paths and exits, without compiling anything.
    # Weekly keepalive, or an on-demand probe. Not on an ordinary build dispatch:
    # the build job restores the same entries, so the access clock is refreshed
    # anyway and the probe would be a redundant 1.5 GiB download.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.probe_only)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # This job only touches the cache to refresh its access clock, and restores
    # This job only touches the cache to refresh its access clock, and restores
    # into a throwaway path. The Release probe step below is what stops this
    # trusted trigger would save that empty directory under the golden key and
    # which would block every future seed.
    steps:
      - name: Checkout for key computation
        uses: actions/checkout@v5

      - name: Touch golden bazel disk cache
        id: touch_cas
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: ios-golden-cas-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-golden-cas-v1-${{ runner.os }}-

      - name: Touch golden external repository cache
        id: touch_repos
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.REPO_CACHE_DIR }}
          key: ios-golden-repos-v1-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-golden-repos-v1-${{ runner.os }}-

      # Same reasoning as the build job's release step: leave nothing for a
      # post-job save to upload under the golden key. An access is recorded by
      # the restore above, which is the only thing this job is here to do.
      - name: Release probe
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "  cas   hit='${{ steps.touch_cas.outputs.cache-hit }}'"
          echo "  repos hit='${{ steps.touch_repos.outputs.cache-hit }}'"
          rm -rf "${BAZEL_CACHE_DIR:?}" "${REPO_CACHE_DIR:?}"
          echo "probe paths emptied; golden access clock refreshed"

  publish:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: publish

      - name: Publish IPA release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ needs.build.outputs.app_name }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          IPA_NAME: ${{ needs.build.outputs.ipa_name }}
        run: |
          set -euo pipefail
          test -s "publish/$IPA_NAME"
          REF=${GITHUB_REF_NAME//\//-}
          RELEASE_TAG="build-${REF}-${BUILD_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          attempt=1
          until gh release create "$RELEASE_TAG" "publish/$IPA_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $APP_VERSION ($BUILD_NUMBER)" \
            --notes "iOS build $APP_VERSION ($BUILD_NUMBER) for $GITHUB_REF_NAME"; do
            if [ "$attempt" -ge 3 ]; then
              echo "ERROR: release creation failed after $attempt attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 10
          done

name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios
      
      - name: Apply branding and custom datacenter
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          python3 build-system/apply_branding.py build-system/branding/branding.json
      
      - name: Regenerate provisioning profiles for bundle id
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          cp -R build-system/fake-codesigning/profiles build-system/fake-codesigning/profiles-backup
          python3 build-system/Make/RegenerateProfilesForBundleId.py \
            --configurationPath=build-system/appstore-configuration.json \
            --sourceProfiles=build-system/fake-codesigning/profiles-backup \
            --destinationProfiles=build-system/fake-codesigning/profiles \
            --certsPath=build-system/fake-codesigning/certs

      - name: Normalize & Generate App Icons
        run: |
          python3 -m pip install --upgrade --break-system-packages Pillow
          cd /Users/Shared/telegram-ios
          python3 build-system/generate_icons.py

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_FOUND=0
          for f in bazel-bin/Telegram/Telegram.ipa \
                   bazel-out/applebin_ios-ios_arm64-opt-ST-*/bin/Telegram/Telegram.ipa \
                   bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$f" ]; then
              echo "Found IPA at: $f"
              cp "$f" "$OUTPUT_PATH/"
              IPA_FOUND=1
              break
            fi
          done

          if [ $IPA_FOUND -eq 0 ]; then
            echo "ERROR: IPA file not found!"
            echo "Searching in bazel-bin:"
            ls -la bazel-bin/Telegram/ || echo "No bazel-bin/Telegram/"
            echo "Searching in bazel-out:"
            find bazel-out -name "*.ipa" 2>/dev/null || echo "No ipa found"
            exit 1
          fi

          # collect dsym
          mkdir -p build/DSYMs
          if [ -d "bazel-bin/Telegram" ]; then
            for f in bazel-bin/Telegram/*.dSYM; do
              if [ -d "$f" ]; then
                echo "Copying dSYM: $f"
                cp -R "$f" build/DSYMs/
              fi
            done
          fi
          
          if [ -z "$(ls -A build/DSYMs 2>/dev/null)" ]; then
            for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
              if [ -d "$f" ]; then
                echo "Copying dSYM from bazel-out: $f"
                cp -R "$f" build/DSYMs/
              fi
            done
          fi
          
          if [ -z "$(ls -A build/DSYMs 2>/dev/null)" ]; then
            echo "WARNING: No dSYM files found!"
          else
            echo "Found dSYM files:"
            ls -la build/DSYMs/
          fi
          
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null
          echo "Build artifacts collected successfully!"
          echo "Contents of $OUTPUT_PATH:"
          ls -la "$OUTPUT_PATH/"

      - name: Prepare unique release tag
        run: |
          set -x
          REF="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          # Uniqueness per run: run_id + run_attempt guarantee a fresh tag every
          # run, so a release is always created and previously published releases
          # are never overwritten or deleted.
          RELEASE_TAG="build-${REF}-${{ env.BUILD_NUMBER }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "release tag: ${RELEASE_TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cd /Users/Shared/telegram-ios

          RELEASE_TAG="${{ env.RELEASE_TAG }}"
          REL_TITLE="Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          REL_NOTES="An unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"

          # Attach only the artifacts that actually exist. dSYMs stay out of the
          # release upload.
          ASSETS=()
          for asset in "build/artifacts/Telegram.ipa"; do
            if [ -f "$asset" ]; then
              ASSETS+=("$asset")
            else
              echo "WARNING: missing artifact, skipping: $asset"
            fi
          done

          # Retry transient API failures; fail loudly only after 3 attempts.
          n=0
          until gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$REL_TITLE" \
            --notes "$REL_NOTES"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "ERROR: failed to create release after $n attempts" >&2
              exit 1
            fi
            echo "release create attempt #$n failed, retrying in 10s"
            sleep 10
          done

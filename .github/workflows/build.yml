name: iOS build

# Standalone build for the Teleram brand on Telegram-iOS 13.0.0.
#
# There is no tbuild-actions service behind this: the branch is a plain source
# tree, upstream release plus one branding commit, and this workflow is the only
# thing that builds it. Branding is applied at build time by
# build-system/apply_branding.py, never committed into the tree, so the same
# commit can be rebuilt for a different host by editing branding.json alone.
#
# The golden cache belongs to this branch alone. A 13.0.0 tree compiles under a
# different Bazel than 12.9.2 did, so every action key differs and the 12.9.2
# generation cannot serve a single action of it. The v13- key prefix keeps the
# two generations unmistakably separate.
on:
  push:
    branches:
      - v13
  workflow_dispatch:
    inputs:
      # Restore both golden entries, report whether they arrived, empty the
      # paths, exit. About two minutes and no compilation - the cheap
      # end-to-end check that the cache wiring still works.
      probe_only:
        description: "Only restore the golden caches and report, without building"
        type: boolean
        default: false
      # Compile the unbranded tree and save a new golden generation. Always a
      # cold build: restoring the previous generation here would need a
      # download, and actions/cache has no lookup-only setting that downloads
      # without arming a post-job save, which could install a near-empty entry
      # under the new key and shadow a good generation for every future build.
      seed_cache:
        description: "Rebuild this branch's golden cache from the unbranded tree (full cold compile)"
        type: boolean
        default: false
  # GitHub evicts cache entries untouched for 7 days. Restoring once a week
  # keeps the last-access clock alive during quiet periods. It builds nothing,
  # but a restore is a real download.
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

# One build at a time. A seed deliberately overlaps nothing: it rotates the
# entry every build reads from, so a concurrent builder could restore a
# generation that is being replaced underneath it.
concurrency:
  group: ios-v13-${{ github.repository }}
  cancel-in-progress: false

env:
  SOURCE_DIR: /Users/Shared/telegram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
  # Both cache directories live outside SOURCE_DIR so bazel never treats them as
  # part of the source tree. Their absolute paths are part of the contract: the
  # save and the restore must agree on them.
  BAZEL_CACHE_DIR: /private/var/tmp/tbuild-cache/bazel-disk
  REPO_CACHE_DIR: /private/var/tmp/tbuild-cache/repos
  # Guard rails for the seed, not the quota. These reject only something
  # implausible for a single build. The quota is enforced after the save,
  # against stored bytes, by the Verify step in the golden job - the one number
  # that matters is the compressed size, which du cannot see.
  MIN_CAS_KB: "262144"    # 256 MiB - below this the build never got going
  MAX_CAS_KB: "9437184"   # 9 GiB
  MAX_REPOS_KB: "3670016" # 3.5 GiB
  QUOTA_BYTES: "10737418240"
  QUOTA_GIB: "10"

jobs:
  # ---------------------------------------------------------------------------
  # Branded build. Restores the golden caches and never writes them: it only
  # ever uses actions/cache/restore, so no post-job save can fire, and it
  # contains no save step at all. The golden job is the only thing that creates
  # a cache entry.
  # ---------------------------------------------------------------------------
  build:
    if: github.event_name != 'schedule' && !inputs.probe_only
    runs-on: macos-latest
    timeout-minutes: 240
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      app_version: ${{ steps.meta.outputs.app_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      ipa_name: ${{ steps.meta.outputs.ipa_name }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: "0"
          persist-credentials: false

      # 13.0.0 pins a newer Xcode than 12.9.2 did. If the runner image does not
      # carry it, say which versions it does carry instead of letting
      # xcode-select fail with a bare "unable to get active developer
      # directory".
      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          if [ ! -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            echo "::error::versions.json pins Xcode ${XCODE_VERSION}, which this runner does not have."
            echo "Available:"; ls -d /Applications/Xcode_*.app 2>/dev/null | sed 's/^/  /' || echo "  (none)"
            exit 1
          fi
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      # Cache handling is strictly best-effort and must never be able to fail a
      # build. A missing entry, a truncated download, an entry evicted by the
      # 7-day policy or a half-written directory all end the same way: the build
      # compiles the whole tree exactly as it did before any of this existed.
      #
      # This step MUST NOT set lookup-only. Despite the name, lookup-only makes
      # actions/cache find the entry, report cache-hit: 'true', and then skip
      # the download, so the build silently compiles from scratch while every
      # step reports success.
      #
      # actions/cache/restore arms a post-job save when it misses and there is
      # no setting that downloads without arming one, so a build is stopped
      # from writing some other way: the "Release restored cache" step empties
      # both paths before the job's post-job steps run. An entry is write-once,
      # so a branded or partial cache saved by a builder would permanently
      # shadow the real golden for every future build.
      #
      # The key is derived from files that are byte-identical on every commit of
      # this branch, so all builds share one entry and a toolchain bump rotates
      # it at once. The v13- prefix is what keeps this generation distinct from
      # the 12.9.2 one, which a different Bazel cannot use at all.
      - name: Restore golden bazel disk cache
        id: restore-cas
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: ios-v13-golden-cas-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-v13-golden-cas-${{ runner.os }}-

      - name: Restore golden external repository cache
        id: restore-repos
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.REPO_CACHE_DIR }}
          key: ios-v13-golden-repos-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-v13-golden-repos-${{ runner.os }}-

      - name: Report restored cache content
        if: always()
        continue-on-error: true
        env:
          CAS_HIT: ${{ steps.restore-cas.outputs.cache-hit }}
          REPOS_HIT: ${{ steps.restore-repos.outputs.cache-hit }}
        run: |
          set -uo pipefail
          inspect() {
            dir="$1"; label="$2"; hit="$3"
            if [ ! -d "$dir" ]; then
              echo "$label: no directory at $dir"
              if [ "$hit" = "true" ]; then
                echo "::error::$label reported a cache hit but $dir does not exist - the entry was matched and never downloaded, so this build is compiling from scratch"
              fi
              return 0
            fi
            echo "$label: $(du -sh "$dir" 2>/dev/null | cut -f1), hit='$hit', top level: $(ls "$dir" 2>/dev/null | tr '\n' ' ')"
          }
          inspect "$BAZEL_CACHE_DIR" "bazel disk cache" "$CAS_HIT"
          inspect "$REPO_CACHE_DIR" "external repository cache" "$REPOS_HIT"

      - name: Prepare canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf "$SOURCE_DIR"
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" "$SOURCE_DIR"

      # Branding is applied here, to the copy, never committed. The script exits
      # non-zero if any upstream anchor has moved, so a half-branded build fails
      # loudly instead of shipping.
      - name: Apply branding and datacenter
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python3 build-system/apply_branding.py build-system/branding/branding.json

      - name: Regenerate provisioning profiles
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          rm -rf build-system/fake-codesigning/profiles-backup
          cp -R build-system/fake-codesigning/profiles build-system/fake-codesigning/profiles-backup
          python3 build-system/Make/RegenerateProfilesForBundleId.py \
            --configurationPath=build-system/appstore-configuration.json \
            --sourceProfiles=build-system/fake-codesigning/profiles-backup \
            --destinationProfiles=build-system/fake-codesigning/profiles \
            --certsPath=build-system/fake-codesigning/certs

      - name: Generate app icons
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade --break-system-packages Pillow==11.3.0
          cd "$SOURCE_DIR"
          python3 build-system/generate_icons.py

      - name: Build and verify IPA
        id: meta
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          BUILD_NUMBER=$(( $(cat build_number_offset) + 1 ))
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          APP_NAME=$(python3 -c 'import json; print(json.load(open("build-system/branding/branding.json"))["general"]["app_name"])')
          printf 'APP_VERSION=%s\nBUILD_NUMBER=%s\n' "$APP_VERSION" "$BUILD_NUMBER" >> "$GITHUB_ENV"

          # Release naming and titles come from branding.json and versions.json,
          # never from constants here, and the artifact name carries the run id so
          # a re-run cannot collide with the artifact of the run it repeats.
          ARTIFACT_NAME="ios-ipa-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}"
          printf 'app_name=%s\napp_version=%s\nbuild_number=%s\nartifact_name=%s\n' \
            "$APP_NAME" "$APP_VERSION" "$BUILD_NUMBER" "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          # --cacheDir maps to bazel's --disk_cache. Make.py's --bazelArguments
          # is parsed but never reaches the bazel command line, so the
          # repository cache goes through the user rc file, which bazel reads
          # after the workspace one and which nothing in the source tree sets.
          mkdir -p "$REPO_CACHE_DIR"
          printf 'common --repository_cache=%s\n' "$REPO_CACHE_DIR" > "$HOME/.bazelrc"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          # tee so the step below has bazel's own closing summary line to read.
          # pipefail is set above, so a failing build still fails this step.
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/bazel-build.log"

          OUTPUT_PATH=build/artifacts
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_FOUND=0
          for candidate in \
            bazel-bin/Telegram/Telegram.ipa \
            bazel-out/applebin_ios-ios_arm64-opt-ST-*/bin/Telegram/Telegram.ipa \
            bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$candidate" ]; then
              # Ship under the brand name from branding.json, not upstream's.
              IPA_NAME=$(printf '%s' "$APP_NAME" | tr -c 'A-Za-z0-9._-' '_')
              IPA_NAME="${IPA_NAME%.ipa}"
              [ -n "$IPA_NAME" ] || IPA_NAME="App"
              cp "$candidate" "$OUTPUT_PATH/$IPA_NAME.ipa"
              printf 'ipa_name=%s.ipa\n' "$IPA_NAME" >> "$GITHUB_OUTPUT"
              IPA_FOUND=1
              break
            fi
          done
          if [ "$IPA_FOUND" -ne 1 ]; then
            echo "::error::no Telegram.ipa was produced; looked under bazel-bin and bazel-out"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/build/artifacts"
          cp "$OUTPUT_PATH"/*.ipa "$GITHUB_WORKSPACE/build/artifacts/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: build/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

      # Best effort, and never fatal. Bazel already prints the whole breakdown
      # on one line at the end of every build, so this reads that line rather
      # than asking bazel to produce anything extra.
      #
      # `worker` is the number that answers "what did branding cost". The
      # workspace rc sets --strategy=SwiftCompile=worker, so worker actions are
      # Swift compiles. internal and local are actions the disk cache never
      # served: a constant baseline that does not move when branding changes, so
      # only a change in `worker` means branding got more expensive.
      #
      # An earlier version asked bazel for --execution_log_json_file instead.
      # That buffers per-action records in the server's heap and OOMed a build
      # that had already reported success, turning a good IPA into a failed
      # job, and it produced no log anyway because the server died before
      # flushing. Reading bazel's own output cannot fail a build.
      - name: Report compile breakdown
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/bazel-build.log"
          if [ ! -s "$LOG" ]; then
            echo "no bazel log at $LOG (the build step did not run, or failed before bazel spoke)"
            exit 0
          fi
          line=$(grep -hoE '[0-9]+ processes: [0-9]+ disk cache hit.*' "$LOG" | tail -1 || true)
          if [ -z "$line" ]; then
            echo "bazel never printed a process summary; nothing to report"
            exit 0
          fi
          echo "$line"
          total=$(printf '%s' "$line" | sed -E 's/^([0-9]+) processes:.*/\1/')
          hit=$(printf '%s' "$line" | sed -E 's/.*: ([0-9]+) disk cache hit.*/\1/')
          worker=$(printf '%s' "$line" | grep -oE '[0-9]+ worker' | grep -oE '[0-9]+' || echo 0)
          pct=0
          [ "$total" -gt 0 ] && pct=$(( hit * 100 / total ))
          echo "  total actions      : $total"
          echo "  disk cache hits    : $hit (${pct}%)"
          echo "  swift compiles run : $worker   <- branding cost"
          {
            echo "### Bazel compile breakdown"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| total actions | $total |"
            echo "| disk cache hits | $hit (${pct}%) |"
            echo "| swift compiles run (branding cost) | $worker |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The IPA is built and the cache has served its purpose, so empty both
      # paths before the job's post-job steps run. This is the ONLY thing
      # stopping a builder from writing the golden. The runner is discarded
      # either way, so releasing the cache costs nothing.
      - name: Release restored cache
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          for dir in "$BAZEL_CACHE_DIR" "$REPO_CACHE_DIR"; do
            if [ -d "$dir" ]; then
              du -sh "$dir" 2>/dev/null | sed 's/^/  releasing /'
              rm -rf "${dir:?}"
            fi
          done
          echo "cache paths emptied; nothing left for a post-job save to upload"

  # ---------------------------------------------------------------------------
  # Publish. Isolated from the build on purpose: it runs on ubuntu, holds the
  # only contents:write token in this workflow, and never checks out or
  # executes source-controlled code. It consumes the IPA the build already
  # verified, so a packaging or signing failure upstream cannot reach it.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: publish

      # Name and version come from branding.json and versions.json, not from
      # constants here. The tag carries the run id and attempt, so re-running a
      # run produces a second distinct release rather than colliding with the
      # first, and the retry loop absorbs a transient API failure without
      # leaving a half-created tag behind.
      - name: Publish IPA release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ needs.build.outputs.app_name }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          IPA_NAME: ${{ needs.build.outputs.ipa_name }}
        run: |
          set -euo pipefail
          test -s "publish/$IPA_NAME"
          REF=${GITHUB_REF_NAME//\//-}
          RELEASE_TAG="build-${REF}-${BUILD_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          attempt=1
          until gh release create "$RELEASE_TAG" "publish/$IPA_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $APP_VERSION ($BUILD_NUMBER)" \
            --notes "iOS build $APP_VERSION ($BUILD_NUMBER) for $GITHUB_REF_NAME"; do
            if [ "$attempt" -ge 3 ]; then
              echo "ERROR: release creation failed after $attempt attempts" >&2
              exit 1
            fi
            attempt=$(( attempt + 1 ))
            sleep 10
          done

  # ---------------------------------------------------------------------------
  # Golden cache seed. Compiles the tree with no branding applied at all, so the
  # cache holds the longest prefix shared by every build of this branch: the
  # untouched submodules and third-party work become reusable and only the
  # modules branding actually edits get recompiled.
  #
  # It never uploads a release. A build failure here is tolerated on purpose - a
  # signing or packaging failure still leaves a perfectly good compile cache
  # behind, and refusing to save it would throw the whole run away.
  # ---------------------------------------------------------------------------
  golden:
    if: github.event_name == 'workflow_dispatch' && inputs.seed_cache
    runs-on: macos-latest
    timeout-minutes: 300
    permissions:
      contents: read
      # Only this job creates or removes cache entries, so it is the only one
      # that needs a token with write access.
      actions: write
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: "0"
          persist-credentials: false

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          if [ ! -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            echo "::error::versions.json pins Xcode ${XCODE_VERSION}, which this runner does not have."
            echo "Available:"; ls -d /Applications/Xcode_*.app 2>/dev/null | sed 's/^/  /' || echo "  (none)"
            exit 1
          fi
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Prepare canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf "$SOURCE_DIR"
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" "$SOURCE_DIR"

      - name: Configure repository cache
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$REPO_CACHE_DIR"
          printf 'common --repository_cache=%s\n' "$REPO_CACHE_DIR" > "$HOME/.bazelrc"

      - name: Compile unbranded tree
        id: compile
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          # Fixed build number: it reaches variables.bzl and therefore the
          # //Telegram packaging actions, and a stable value keeps them
          # comparable between generations.
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=1 2>&1 | tee "$RUNNER_TEMP/bazel-build.log"

      # The seed is always a cold compile, so this is the denominator: the total
      # number of actions a full build of this tree contains. A branded build's
      # executed count divided by this is the reuse ratio. Recorded here because
      # the seed is the only job that ever sees every action.
      - name: Report total action count
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ ! -s "$RUNNER_TEMP/bazel-build.log" ]; then
            echo "no bazel log; nothing to report"
            exit 0
          fi
          total=$(grep -hoE '[0-9]+ processes: [0-9]+ disk cache hit.*' "$RUNNER_TEMP/bazel-build.log" | tail -1 || true)
          if [ -z "$total" ]; then
            echo "bazel never printed a process summary; nothing to report"
            exit 0
          fi
          echo "golden seed executed $total"
          {
            echo "### Golden seed"
            echo
            echo '```'
            echo "$total"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure generated caches
        id: size
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          cas_kb=0
          repos_kb=0
          [ -d "$BAZEL_CACHE_DIR" ] && cas_kb=$(du -sk "$BAZEL_CACHE_DIR" | cut -f1)
          [ -d "$REPO_CACHE_DIR" ] && repos_kb=$(du -sk "$REPO_CACHE_DIR" | cut -f1)
          mib() { printf '%d' $(( $1 / 1024 )); }
          echo "bazel disk cache: $(mib "$cas_kb") MiB ($(du -sh "$BAZEL_CACHE_DIR" 2>/dev/null | cut -f1) on disk, uncompressed)"
          echo "repository cache: $(mib "$repos_kb") MiB ($(du -sh "$REPO_CACHE_DIR" 2>/dev/null | cut -f1) on disk, uncompressed)"
          printf 'cas_kb=%s\nrepos_kb=%s\n' "$cas_kb" "$repos_kb" >> "$GITHUB_OUTPUT"

      - name: Save golden bazel disk cache
        if: always() && steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: ios-v13-golden-cas-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}

      - name: Save golden external repository cache
        if: always() && steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.REPO_CACHE_DIR }}
          key: ios-v13-golden-repos-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}

      # The explicit save steps above are the only thing in this workflow that
      # writes a cache entry. The quota is enforced here against STORED bytes,
      # because actions/cache zstd-compresses before uploading and du cannot see
      # that. A seed that died during analysis can leave a near-empty entry,
      # which would shadow the good generation for every future build, so an
      # implausibly small cache is not saved at all.
      - name: Verify stored cache size against the quota
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CAS: ios-v13-golden-cas-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          CURRENT_REPOS: ios-v13-golden-repos-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
        run: |
          set -uo pipefail
          cas_kb=${{ steps.size.outputs.cas_kb || 0 }}
          repos_kb=${{ steps.size.outputs.repos_kb || 0 }}
          gib() { printf '%.2f' "$(echo "scale=4; $1 / 1048576" | bc)"; }
          if [ "$cas_kb" -lt "$MIN_CAS_KB" ] || [ "$cas_kb" -gt "$MAX_CAS_KB" ]; then
            echo "::error::bazel disk cache is $(gib "$cas_kb") GiB, outside [$(gib "$MIN_CAS_KB"), $(gib "$MAX_CAS_KB")] GiB - NOT saving, so the next build will compile from scratch."
            exit 0
          fi
          if [ "$repos_kb" -gt "$MAX_REPOS_KB" ]; then
            echo "::warning::repository cache is $(gib "$repos_kb") GiB, outside (0, $(gib "$MAX_REPOS_KB")] GiB - not saving"
          fi
          total=0
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > /tmp/caches.json
          python3 -c '
          import json, os
          total = int(os.environ["QUOTA_BYTES"])
          keep = {os.environ["CURRENT_CAS"], os.environ["CURRENT_REPOS"]}
          grand = 0
          for c in json.load(open("/tmp/caches.json")).get("actions_caches", []):
              grand += c.get("size_in_bytes", 0)
              flag = "keep" if c["key"] in keep else "stale"
              print("  %s  %8.2f MiB  %s" % (flag, c.get("size_in_bytes", 0) / 1048576.0, c["key"]))
          print("stored cache total: %.2f GiB of quota %.0f GiB" % (grand / 1073741824.0, total / 1073741824.0))
          '

      # Best effort. A cache entry is write-once, so a superseded generation has
      # to be deleted explicitly or it lingers until eviction and pushes the
      # repository over quota alongside its replacement. Failure here only costs
      # quota, so it must not fail the job.
      - name: Retire superseded golden entries
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CAS: ios-v13-golden-cas-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          CURRENT_REPOS: ios-v13-golden-repos-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
        run: |
          set -uo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > /tmp/caches.json
          python3 -c '
          import json, os
          keep = {os.environ["CURRENT_CAS"], os.environ["CURRENT_REPOS"]}
          caches = json.load(open("/tmp/caches.json")).get("actions_caches", [])
          for c in caches:
              if c["key"].startswith("ios-v13-golden-") and c["key"] not in keep:
                  print(c["id"])
          ' > /tmp/stale_ids
          while read -r id; do
            [ -n "$id" ] || continue
            echo "deleting superseded cache $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" || true
          done < /tmp/stale_ids

  # ---------------------------------------------------------------------------
  # Weekly keepalive. Restores the golden entries so their last-access clock is
  # refreshed and the 7-day eviction window does not swallow them, then empties
  # the paths so this job cannot write anything either. This builds nothing, but
  # a restore is a real download, so it costs a few minutes of runner time.
  # ---------------------------------------------------------------------------
  keepalive:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.probe_only)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Restore golden bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: ios-v13-golden-cas-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-v13-golden-cas-${{ runner.os }}-

      - name: Restore golden external repository cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.REPO_CACHE_DIR }}
          key: ios-v13-golden-repos-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc') }}
          restore-keys: |
            ios-v13-golden-repos-${{ runner.os }}-

      - name: Report and release
        if: always()
        run: |
          set -uo pipefail
          for dir in "$BAZEL_CACHE_DIR" "$REPO_CACHE_DIR"; do
            if [ -d "$dir" ]; then
              echo "  $dir: $(du -sh "$dir" | cut -f1)"
            else
              echo "  $dir: MISSING - the entry was matched and never downloaded, or was evicted"
            fi
          done
          for dir in "$BAZEL_CACHE_DIR" "$REPO_CACHE_DIR"; do
            [ -d "$dir" ] && rm -rf "${dir:?}"
          done